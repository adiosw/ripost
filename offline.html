<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline – Ripost AI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:#07070d;color:#f0f0f8;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .icon{font-size:5rem;margin-bottom:1.5rem}
    h1{font-size:2rem;font-weight:800;margin-bottom:0.75rem;background:linear-gradient(135deg,#6c63ff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    p{color:#9090b0;line-height:1.7;max-width:400px;margin:0 auto 1.5rem}
    button{padding:0.875rem 2rem;background:linear-gradient(135deg,#6c63ff,#ff6b9d);border:none;border-radius:100px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:transform 0.2s}
    button:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>Brak połączenia</h1>
    <p>Ripost AI wymaga połączenia z internetem. Sprawdź swoje połączenie i spróbuj ponownie.</p>
    <button onclick="window.location.reload()">🔄 Spróbuj ponownie</button>
  </div>
</body>
</html>
